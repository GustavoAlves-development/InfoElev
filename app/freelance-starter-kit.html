<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Freelance Starter Kit — App | Infoelev</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="logo">Info<span>elev</span></div>
    <div class="product-name">The Freelance Starter Kit</div>
    <div class="app-progress-wrap">
      <div class="app-progress-label" id="app-progress-label"><span>0 of 0 read</span><span>0%</span></div>
      <div class="app-progress-track"><div class="app-progress-fill" id="app-progress-fill" style="width:0%"></div></div>
    </div>
    <nav id="app-sidebar-nav"></nav>
    <div class="app-sidebar-footer">
      <a href="/freelance-starter-kit.html">&larr; Back to product page</a>
      <a href="/account.html">My account</a>
      <a href="#" data-logout>Log out</a>
    </div>
  </aside>
  <main class="app-main" id="app-main-content"></main>
</div>

<script src="/assets/js/app-shell.js"></script>
<script src="/app/content/freelance-starter-kit.js"></script>
<script>
  const CHAPTERS = window.ELEV_CHAPTERS || [];

  function renderContentSection(container, ch) {
    container.innerHTML =
      '<div class="app-eyebrow">' + ch.module + '</div>' +
      '<h1 class="app-title">' + ch.heading + '</h1>' +
      '<p class="app-dek">' + ch.dek + '</p>' +
      '<div class="app-rule"></div>' +
      '<div class="app-body">' + renderBlocks(ch.body) + '</div>';
  }

  function renderTargetCalculator(container, store) {
    let rows = store.getTool("expenses", []);
    if (!rows.length) rows = [
      { category: "Housing", amount: "" },
      { category: "Utilities", amount: "" },
      { category: "Food", amount: "" }
    ];
    let months = store.getTool("months", 3);

    container.innerHTML =
      '<div class="app-eyebrow">Tool</div>' +
      '<h1 class="app-title">Target Number Calculator</h1>' +
      '<p class="app-dek">List your essential monthly expenses, then set how many months of coverage you want.</p>' +
      '<div class="app-rule"></div>' +
      '<div class="tool-card">' +
      '<table class="tool-table"><thead><tr><th>Essential expense</th><th>Monthly amount</th><th></th></tr></thead>' +
      '<tbody id="tc-rows"></tbody></table>' +
      '<button class="btn btn-ghost btn-sm" id="tc-add">+ Add expense</button>' +
      '<div class="tool-summary" id="tc-monthly"></div>' +
      '</div>' +
      '<div class="tool-card">' +
      '<div class="tool-field"><label for="tc-months">Months of coverage</label><input type="number" id="tc-months" value="' + months + '"></div>' +
      '<div class="tool-summary balanced" id="tc-final"></div>' +
      '</div>';

    const tbody = document.getElementById("tc-rows");
    const monthsInput = document.getElementById("tc-months");

    function renderRows() {
      tbody.innerHTML = rows.map((r, i) =>
        '<tr>' +
        '<td><input type="text" class="tc-cat" data-i="' + i + '" value="' + r.category + '" placeholder="e.g. Rent"></td>' +
        '<td class="amount-col"><input type="number" class="tc-amount" data-i="' + i + '" value="' + r.amount + '" placeholder="0.00"></td>' +
        '<td><button class="tool-remove-btn" data-i="' + i + '">&times;</button></td>' +
        '</tr>'
      ).join("");
      tbody.querySelectorAll(".tc-cat").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].category = el.value; persist(); }));
      tbody.querySelectorAll(".tc-amount").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].amount = el.value; persist(); recalc(); }));
      tbody.querySelectorAll(".tool-remove-btn").forEach((el) => el.addEventListener("click", () => {
        rows.splice(+el.dataset.i, 1);
        if (!rows.length) rows.push({ category: "", amount: "" });
        persist(); renderRows(); recalc();
      }));
    }

    function recalc() {
      const totalMonthly = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
      const m = parseFloat(monthsInput.value) || 0;
      document.getElementById("tc-monthly").innerHTML = "<span>" + formatCurrency(totalMonthly) + "/month in essentials</span><span></span>";
      document.getElementById("tc-final").innerHTML = "<span>Your Freedom Fund target</span><span>" + formatCurrency(totalMonthly * m) + "</span>";
    }

    function persist() { store.setTool("expenses", rows); }

    document.getElementById("tc-add").addEventListener("click", () => {
      rows.push({ category: "", amount: "" });
      persist(); renderRows(); recalc();
    });

    monthsInput.addEventListener("input", () => { store.setTool("months", monthsInput.value); recalc(); });

    renderRows();
    recalc();
  }

  const ROADMAP_ITEMS = buildRoadmapItems(CHAPTERS);

  const sections = CHAPTERS.map((ch) => ({ id: ch.id, group: "content", label: ch.label, render: (c) => renderContentSection(c, ch) }));
  sections.push({ id: "tool-calc", group: "tools", label: "Target Number Calculator", render: renderTargetCalculator });
  if (CHAPTERS.length) sections.push({ id: "tool-roadmap", group: "tools", label: "Action Roadmap", render: (c, store) => renderRoadmap(c, store, ROADMAP_ITEMS) });

  initAppShell({ productId: "freelance-starter-kit", sections: sections, locked: !CHAPTERS.length });
</script>
</body>
</html>
