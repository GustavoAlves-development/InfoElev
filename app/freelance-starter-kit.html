<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Freelance Starter Kit — App | Infoelev</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="logo">Info<span>elev</span></div>
    <div class="product-name">The Freelance Starter Kit</div>
    <div class="app-progress-wrap">
      <div class="app-progress-label" id="app-progress-label"><span>0 of 0 read</span><span>0%</span></div>
      <div class="app-progress-track"><div class="app-progress-fill" id="app-progress-fill" style="width:0%"></div></div>
    </div>
    <nav id="app-sidebar-nav"></nav>
    <div class="app-sidebar-footer">
      <a href="/freelance-starter-kit.html">&larr; Back to product page</a>
      <a href="/account.html">My account</a>
      <a href="#" data-logout>Log out</a>
    </div>
  </aside>
  <main class="app-main" id="app-main-content"></main>
</div>

<script src="/assets/js/app-shell.js"></script>
<script src="/app/content/freelance-starter-kit.js"></script>
<script>
  const CHAPTERS = window.ELEV_CHAPTERS || [];

  function renderContentSection(container, ch) {
    container.innerHTML =
      '<div class="app-eyebrow">' + ch.module + '</div>' +
      '<h1 class="app-title">' + ch.heading + '</h1>' +
      '<p class="app-dek">' + ch.dek + '</p>' +
      '<div class="app-rule"></div>' +
      '<div class="app-body">' + renderBlocks(ch.body) + '</div>';
  }

  const TOOL = {
      storeKey: "rate",
      title: "Freelance Rate Calculator",
      dek: "List what you want to take home and what your business costs each month, then set how many hours you can realistically bill.",
      addLabel: "+ Add line",
      fields: [{ key: "hours", label: "Billable hours per month", value: 40 }],
      defaults: [
        { item: "Take-home income goal", amount: "" },
        { item: "Software & tools", amount: "" },
        { item: "Tax set-aside", amount: "" }
      ],
      columns: [
        { key: "item", label: "Monthly need", type: "text", placeholder: "e.g. Internet" },
        { key: "amount", label: "Amount / month", type: "number", placeholder: "0.00" }
      ],
      summary(rows, f) {
        const monthly = rows.reduce((s, r) => s + num(r.amount), 0);
        const hours = num(f.hours);
        return { className: "balanced", html: "<span>" + formatCurrency(monthly) + "/month needed</span><span>Minimum rate: " + (hours ? formatCurrency(monthly / hours) + "/hour" : "—") + "</span>" };
      }
    };

  const ROADMAP_ITEMS = buildRoadmapItems(CHAPTERS);

  const sections = CHAPTERS.map((ch) => ({ id: ch.id, group: "content", label: ch.label, render: (c) => renderContentSection(c, ch) }));
  sections.push({ id: "tool-rate", group: "tools", label: "Freelance Rate Calculator", render: (c, store) => renderTableTool(c, store, TOOL) });
  if (CHAPTERS.length) sections.push({ id: "tool-roadmap", group: "tools", label: "Action Roadmap", render: (c, store) => renderRoadmap(c, store, ROADMAP_ITEMS) });

  initAppShell({ productId: "freelance-starter-kit", sections: sections, locked: !CHAPTERS.length });
</script>
</body>
</html>
