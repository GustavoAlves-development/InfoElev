<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Side Hustle Ledger — App | Infoelev</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="logo">Info<span>elev</span></div>
    <div class="product-name">The Side Hustle Ledger</div>
    <div class="app-progress-wrap">
      <div class="app-progress-label" id="app-progress-label"><span>0 of 0 read</span><span>0%</span></div>
      <div class="app-progress-track"><div class="app-progress-fill" id="app-progress-fill" style="width:0%"></div></div>
    </div>
    <nav id="app-sidebar-nav"></nav>
    <div class="app-sidebar-footer">
      <a href="/side-hustle-ledger.html">&larr; Back to product page</a>
      <a href="/account.html">My account</a>
      <a href="#" data-logout>Log out</a>
    </div>
  </aside>
  <main class="app-main" id="app-main-content"></main>
</div>

<script src="/assets/js/app-shell.js"></script>
<script src="/app/content/side-hustle-ledger.js"></script>
<script>
  const CHAPTERS = window.ELEV_CHAPTERS || [];

  function renderContentSection(container, ch) {
    container.innerHTML =
      '<div class="app-eyebrow">' + ch.module + '</div>' +
      '<h1 class="app-title">' + ch.heading + '</h1>' +
      '<p class="app-dek">' + ch.dek + '</p>' +
      '<div class="app-rule"></div>' +
      '<div class="app-body">' + renderBlocks(ch.body) + '</div>';
  }

  function renderWeeklyLedger(container, store) {
    let rows = store.getTool("ledger", []);
    if (!rows.length) rows = [
      { category: "Essentials", planned: "", actual: "" },
      { category: "Flexible", planned: "", actual: "" },
      { category: "Future", planned: "", actual: "" }
    ];

    container.innerHTML =
      '<div class="app-eyebrow">Tool</div>' +
      '<h1 class="app-title">Weekly Ledger</h1>' +
      '<p class="app-dek">Plan each category, then log what actually happened. Updates automatically.</p>' +
      '<div class="app-rule"></div>' +
      '<div class="tool-card">' +
      '<table class="tool-table"><thead><tr><th>Category</th><th>Planned</th><th>Actual</th><th></th></tr></thead>' +
      '<tbody id="wl-rows"></tbody></table>' +
      '<button class="btn btn-ghost btn-sm" id="wl-add">+ Add category</button>' +
      '<div class="tool-summary" id="wl-total"></div>' +
      '</div>';

    const tbody = document.getElementById("wl-rows");

    function renderRows() {
      tbody.innerHTML = rows.map((r, i) =>
        '<tr>' +
        '<td><input type="text" class="wl-cat" data-i="' + i + '" value="' + r.category + '" placeholder="e.g. Groceries"></td>' +
        '<td class="amount-col"><input type="number" class="wl-planned" data-i="' + i + '" value="' + r.planned + '" placeholder="0.00"></td>' +
        '<td class="amount-col"><input type="number" class="wl-actual" data-i="' + i + '" value="' + r.actual + '" placeholder="0.00"></td>' +
        '<td><button class="tool-remove-btn" data-i="' + i + '">&times;</button></td>' +
        '</tr>'
      ).join("");
      tbody.querySelectorAll(".wl-cat").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].category = el.value; persist(); }));
      tbody.querySelectorAll(".wl-planned").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].planned = el.value; persist(); recalc(); }));
      tbody.querySelectorAll(".wl-actual").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].actual = el.value; persist(); recalc(); }));
      tbody.querySelectorAll(".tool-remove-btn").forEach((el) => el.addEventListener("click", () => {
        rows.splice(+el.dataset.i, 1);
        if (!rows.length) rows.push({ category: "", planned: "", actual: "" });
        persist(); renderRows(); recalc();
      }));
    }

    function recalc() {
      const totalPlanned = rows.reduce((s, r) => s + (parseFloat(r.planned) || 0), 0);
      const totalActual = rows.reduce((s, r) => s + (parseFloat(r.actual) || 0), 0);
      const diff = totalPlanned - totalActual;
      const el = document.getElementById("wl-total");
      el.className = "tool-summary " + (diff >= 0 ? "balanced" : "unbalanced");
      el.innerHTML =
        "<span>" + formatCurrency(totalPlanned) + " planned vs " + formatCurrency(totalActual) + " actual</span>" +
        "<span>" + (diff >= 0 ? formatCurrency(diff) + " under plan" : formatCurrency(Math.abs(diff)) + " over plan") + "</span>";
    }

    function persist() { store.setTool("ledger", rows); }

    document.getElementById("wl-add").addEventListener("click", () => {
      rows.push({ category: "", planned: "", actual: "" });
      persist(); renderRows(); recalc();
    });

    renderRows();
    recalc();
  }

  const ROADMAP_ITEMS = buildRoadmapItems(CHAPTERS);

  const sections = CHAPTERS.map((ch) => ({ id: ch.id, group: "content", label: ch.label, render: (c) => renderContentSection(c, ch) }));
  sections.push({ id: "tool-ledger", group: "tools", label: "Weekly Ledger", render: renderWeeklyLedger });
  if (CHAPTERS.length) sections.push({ id: "tool-roadmap", group: "tools", label: "Action Roadmap", render: (c, store) => renderRoadmap(c, store, ROADMAP_ITEMS) });

  initAppShell({ productId: "side-hustle-ledger", sections: sections, locked: !CHAPTERS.length });
</script>
</body>
</html>
