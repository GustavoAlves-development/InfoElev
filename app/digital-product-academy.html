<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Digital Product Academy — App | Infoelev</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="logo">Info<span>elev</span></div>
    <div class="product-name">Digital Product Academy</div>
    <div class="app-progress-wrap">
      <div class="app-progress-label" id="app-progress-label"><span>0 of 0 read</span><span>0%</span></div>
      <div class="app-progress-track"><div class="app-progress-fill" id="app-progress-fill" style="width:0%"></div></div>
    </div>
    <nav id="app-sidebar-nav"></nav>
    <div class="app-sidebar-footer">
      <a href="/digital-product-academy.html">&larr; Back to product page</a>
      <a href="/account.html">My account</a>
      <a href="#" data-logout>Log out</a>
    </div>
  </aside>
  <main class="app-main" id="app-main-content"></main>
</div>

<script src="/assets/js/app-shell.js"></script>
<script src="/app/content/digital-product-academy.js"></script>
<script>
  const CHAPTERS = window.ELEV_CHAPTERS || [];

  function renderContentSection(container, ch) {
    container.innerHTML =
      '<div class="app-eyebrow">' + ch.module + '</div>' +
      '<h1 class="app-title">' + ch.heading + '</h1>' +
      '<p class="app-dek">' + ch.dek + '</p>' +
      '<div class="app-rule"></div>' +
      '<div class="app-body">' + renderBlocks(ch.body) + '</div>';
  }

  function renderPortfolioWorksheet(container, store) {
    let rows = store.getTool("portfolio", []);
    if (!rows.length) rows = [
      { asset: "Broad stock funds", target: "" },
      { asset: "Bonds / stable assets", target: "" },
      { asset: "Cash reserve", target: "" }
    ];

    container.innerHTML =
      '<div class="app-eyebrow">Tool</div>' +
      '<h1 class="app-title">Starter Portfolio Worksheet</h1>' +
      '<p class="app-dek">Sketch a simple target allocation. Your targets should add up to 100%.</p>' +
      '<div class="app-rule"></div>' +
      '<div class="tool-card">' +
      '<table class="tool-table"><thead><tr><th>Asset class</th><th>Target %</th><th></th></tr></thead>' +
      '<tbody id="pw-rows"></tbody></table>' +
      '<button class="btn btn-ghost btn-sm" id="pw-add">+ Add asset class</button>' +
      '<div class="tool-summary" id="pw-total"></div>' +
      '</div>';

    const tbody = document.getElementById("pw-rows");

    function renderRows() {
      tbody.innerHTML = rows.map((r, i) =>
        '<tr>' +
        '<td><input type="text" class="pw-asset" data-i="' + i + '" value="' + r.asset + '" placeholder="e.g. Broad stock funds"></td>' +
        '<td class="amount-col"><input type="number" class="pw-target" data-i="' + i + '" value="' + r.target + '" placeholder="0"></td>' +
        '<td><button class="tool-remove-btn" data-i="' + i + '">&times;</button></td>' +
        '</tr>'
      ).join("");
      tbody.querySelectorAll(".pw-asset").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].asset = el.value; persist(); }));
      tbody.querySelectorAll(".pw-target").forEach((el) => el.addEventListener("input", () => { rows[+el.dataset.i].target = el.value; persist(); recalc(); }));
      tbody.querySelectorAll(".tool-remove-btn").forEach((el) => el.addEventListener("click", () => {
        rows.splice(+el.dataset.i, 1);
        if (!rows.length) rows.push({ asset: "", target: "" });
        persist(); renderRows(); recalc();
      }));
    }

    function recalc() {
      const total = rows.reduce((s, r) => s + (parseFloat(r.target) || 0), 0);
      const el = document.getElementById("pw-total");
      el.className = "tool-summary " + (total === 100 ? "balanced" : "unbalanced");
      el.innerHTML =
        "<span>" + total + "% allocated</span>" +
        "<span>" + (total === 100 ? "Fully allocated" : total < 100 ? (100 - total) + "% remaining" : "Over by " + (total - 100) + "%") + "</span>";
    }

    function persist() { store.setTool("portfolio", rows); }

    document.getElementById("pw-add").addEventListener("click", () => {
      rows.push({ asset: "", target: "" });
      persist(); renderRows(); recalc();
    });

    renderRows();
    recalc();
  }

  const ROADMAP_ITEMS = buildRoadmapItems(CHAPTERS);

  const sections = CHAPTERS.map((ch) => ({ id: ch.id, group: "content", label: ch.label, render: (c) => renderContentSection(c, ch) }));
  sections.push({ id: "tool-portfolio", group: "tools", label: "Starter Portfolio Worksheet", render: renderPortfolioWorksheet });
  if (CHAPTERS.length) sections.push({ id: "tool-roadmap", group: "tools", label: "Action Roadmap", render: (c, store) => renderRoadmap(c, store, ROADMAP_ITEMS) });

  initAppShell({ productId: "digital-product-academy", sections: sections, locked: !CHAPTERS.length });
</script>
</body>
</html>
