<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Digital Product Academy — App | Infoelev</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar">
    <div class="logo">Info<span>elev</span></div>
    <div class="product-name">Digital Product Academy</div>
    <div class="app-progress-wrap">
      <div class="app-progress-label" id="app-progress-label"><span>0 of 0 read</span><span>0%</span></div>
      <div class="app-progress-track"><div class="app-progress-fill" id="app-progress-fill" style="width:0%"></div></div>
    </div>
    <nav id="app-sidebar-nav"></nav>
    <div class="app-sidebar-footer">
      <a href="/digital-product-academy.html">&larr; Back to product page</a>
      <a href="/account.html">My account</a>
      <a href="#" data-logout>Log out</a>
    </div>
  </aside>
  <main class="app-main" id="app-main-content"></main>
</div>

<script src="/assets/js/app-shell.js"></script>
<script src="/app/content/digital-product-academy.js"></script>
<script>
  const CHAPTERS = window.ELEV_CHAPTERS || [];

  function renderContentSection(container, ch) {
    container.innerHTML =
      '<div class="app-eyebrow">' + ch.module + '</div>' +
      '<h1 class="app-title">' + ch.heading + '</h1>' +
      '<p class="app-dek">' + ch.dek + '</p>' +
      '<div class="app-rule"></div>' +
      '<div class="app-body">' + renderBlocks(ch.body) + '</div>';
  }

  const TOOL = {
      storeKey: "revenue",
      title: "Product Revenue Planner",
      dek: "Enter each product or tier with its price and expected monthly sales. Set the fee your platform and payment processor take.",
      addLabel: "+ Add product or tier",
      fields: [{ key: "fee", label: "Platform + payment fees (%)", value: 10 }],
      columns: [
        { key: "name", label: "Product / tier", type: "text", placeholder: "e.g. Starter guide" },
        { key: "price", label: "Price", type: "number", placeholder: "0.00" },
        { key: "sales", label: "Sales / month", type: "number", placeholder: "0" }
      ],
      summary(rows, f) {
        const gross = rows.reduce((s, r) => s + num(r.price) * num(r.sales), 0);
        const net = gross * (1 - num(f.fee) / 100);
        return { className: "balanced", html: "<span>" + formatCurrency(gross) + "/month gross</span><span>" + formatCurrency(net) + "/month after fees</span>" };
      }
    };

  const ROADMAP_ITEMS = buildRoadmapItems(CHAPTERS);

  const sections = CHAPTERS.map((ch) => ({ id: ch.id, group: "content", label: ch.label, render: (c) => renderContentSection(c, ch) }));
  sections.push({ id: "tool-revenue", group: "tools", label: "Product Revenue Planner", render: (c, store) => renderTableTool(c, store, TOOL) });
  if (CHAPTERS.length) sections.push({ id: "tool-roadmap", group: "tools", label: "Action Roadmap", render: (c, store) => renderRoadmap(c, store, ROADMAP_ITEMS) });

  initAppShell({ productId: "digital-product-academy", sections: sections, locked: !CHAPTERS.length });
</script>
</body>
</html>
