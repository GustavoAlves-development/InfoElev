<!doctype html>
<!-- Stripe product cover template. Rendered to PNG by scripts/covers/render.mjs (?p=<product key>). -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space Grotesk:ital,wght@0,500;0,600;1,500&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111816; --surface-deep: #e2ebe6; --accent: #0f8a5f; --accent-light: #22b07d; --accent-pale: #c9ecdc; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; }
  .cover { position: relative; width: 1000px; height: 1000px; padding: 72px; display: flex; flex-direction: column; }
  .cover::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(currentColor 2px, transparent 2px); background-size: 36px 36px; opacity: 0.07; }
  .dark { background: linear-gradient(155deg, var(--ink) 0%, #16261f 100%); color: var(--accent-light); }
  .light { background: linear-gradient(155deg, var(--accent-pale) 0%, var(--surface-deep) 100%); color: var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: baseline; position: relative; }
  .num { font-family: "Space Grotesk", sans-serif; font-style: italic; font-weight: 500; font-size: 88px; opacity: 0.4; line-height: 1; }
  .brand { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 40px; }
  .brand em { color: var(--accent); font-style: italic; }
  .dark .brand { color: #eef3f0; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .art svg { width: 62%; }
  .format { font-family: "Inter", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; position: relative; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 78px; line-height: 1.05; margin-top: 14px; position: relative; }
  .dark h1 { color: #eef3f0; }
</style>
</head>
<body>
<div id="cover" class="cover"></div>
<script>
  const ART = {
    elevation: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 88 L15 70 L42 70 L42 56 L69 56 L69 38 L96 38 L96 20 L128 20"/><circle cx="128" cy="20" r="5" fill="currentColor" stroke="none"/></svg>',
    income: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="84" r="4" fill="currentColor" stroke="none"/><path d="M24 84 L64 64" opacity="0.45"/><path d="M24 84 L100 44" opacity="0.72"/><path d="M24 84 L136 20"/><path d="M120 16 L136 20 L130 35" stroke-width="2.5"/></svg>',
    ledger: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="24" x2="132" y2="24" opacity="0.55"/><line x1="20" y1="45" x2="132" y2="45" opacity="0.55"/><line x1="20" y1="66" x2="92" y2="66" opacity="0.55"/><path d="M96 66 L107 77 L128 54" stroke-width="3.5"/></svg>',
    investing: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="80" cy="52" r="9" fill="currentColor" stroke="none"/><circle cx="80" cy="52" r="26" opacity="0.6"/><circle cx="80" cy="52" r="41" opacity="0.32"/></svg>',
    freedom: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M80 14 L112 24 L112 52 C112 72 98 85 80 90 C62 85 48 72 48 52 L48 24 Z"/><path d="M68 52 L77 61 L94 40" stroke-width="3.5"/></svg>',
    library: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="22" width="18" height="66" rx="2"/><rect x="46" y="14" width="18" height="74" rx="2" opacity="0.8"/><rect x="70" y="26" width="18" height="62" rx="2"/><rect x="94" y="18" width="18" height="70" rx="2" opacity="0.8"/><path d="M118 30 L134 26 L148 86 L132 90 Z"/></svg>',
    tools: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="26" x2="130" y2="26" opacity="0.5"/><line x1="30" y1="52" x2="130" y2="52" opacity="0.5"/><line x1="30" y1="78" x2="130" y2="78" opacity="0.5"/><circle cx="96" cy="26" r="8" fill="currentColor" stroke="none"/><circle cx="56" cy="52" r="8" fill="currentColor" stroke="none"/><circle cx="110" cy="78" r="8" fill="currentColor" stroke="none"/></svg>',
    allaccess: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M80 12 L90 40 L120 40 L96 58 L105 88 L80 70 L55 88 L64 58 L40 40 L70 40 Z"/></svg>',
  };
  const PRODUCTS = {
    elevation: { num: "01", theme: "light", format: "90-Day Program", title: "Side Income Launchpad" },
    income: { num: "02", theme: "dark", format: "30-Day Playbook", title: "Online Gig Playbook" },
    ledger: { num: "03", theme: "light", format: "Tracking System", title: "The Side Hustle Ledger" },
    investing: { num: "04", theme: "dark", format: "Beginner Guide", title: "Digital Product Academy" },
    freedom: { num: "05", theme: "light", format: "Savings Blueprint", title: "The Freelance Starter Kit" },
    library: { num: "01–05", theme: "dark", format: "Complete Bundle", title: "The Full Infoelev Library" },
    tools: { num: "", theme: "light", format: "Monthly Membership", title: "Infoelev Tools" },
    allaccess: { num: "", theme: "dark", format: "Monthly Membership", title: "Infoelev All Access" },
  };
  const key = new URLSearchParams(location.search).get("p") || "elevation";
  const p = PRODUCTS[key];
  const el = document.getElementById("cover");
  el.className = "cover " + p.theme;
  el.innerHTML =
    '<div class="top"><span class="num">' + p.num + '</span><span class="brand">Elev<em>Pay</em></span></div>' +
    '<div class="art">' + ART[key] + '</div>' +
    '<div class="format">' + p.format + '</div>' +
    '<h1>' + p.title + '</h1>';
</script>
</body>
</html>
