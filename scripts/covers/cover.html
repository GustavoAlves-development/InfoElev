<!doctype html>
<!-- Stripe product cover template. Rendered to PNG by scripts/covers/render.mjs (?p=<product key>). -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111816; --surface-deep: #e2ebe6; --accent: #0f8a5f; --accent-light: #22b07d; --accent-pale: #c9ecdc; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; }
  .cover { position: relative; width: 1000px; height: 1000px; padding: 72px; display: flex; flex-direction: column; }
  .cover::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(currentColor 2px, transparent 2px); background-size: 36px 36px; opacity: 0.07; }
  .dark { background: linear-gradient(155deg, var(--ink) 0%, #16261f 100%); color: var(--accent-light); }
  .light { background: linear-gradient(155deg, var(--accent-pale) 0%, var(--surface-deep) 100%); color: var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: baseline; position: relative; }
  .num { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 88px; opacity: 0.4; line-height: 1; }
  .brand { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 40px; }
  .brand em { color: var(--accent); font-style: normal; }
  .dark .brand em { color: var(--accent-light); }
  .dark .brand { color: #eef3f0; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .art svg { width: 62%; }
  .format { font-family: "Inter", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; position: relative; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 78px; line-height: 1.05; margin-top: 14px; position: relative; }
  .dark h1 { color: #eef3f0; }
</style>
</head>
<body>
<div id="cover" class="cover"></div>
<script>
  const ART = {
    launchpad: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="28" y1="88" x2="132" y2="88" opacity="0.5"/><path d="M80 76 L80 16"/><path d="M62 34 L80 16 L98 34"/><path d="M52 76 L52 62" opacity="0.45"/><path d="M108 76 L108 54" opacity="0.7"/></svg>',
    gigs: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="80" cy="50" r="38"/><ellipse cx="80" cy="50" rx="16" ry="38" opacity="0.6"/><line x1="42" y1="50" x2="118" y2="50" opacity="0.6"/><circle cx="118" cy="22" r="6" fill="currentColor" stroke="none"/></svg>',
    hustle: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="26" y="58" width="16" height="30" rx="2" opacity="0.5"/><rect x="50" y="44" width="16" height="44" rx="2" opacity="0.75"/><rect x="74" y="30" width="16" height="58" rx="2"/><circle cx="122" cy="40" r="20"/><path d="M122 31 L122 49 M115 40 L129 40" stroke-width="2.5"/></svg>',
    academy: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M80 14 L128 34 L80 54 L32 34 Z"/><path d="M32 50 L80 70 L128 50" opacity="0.7"/><path d="M32 66 L80 86 L128 66" opacity="0.4"/></svg>',

    sprint7: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M70 10 L46 56 L76 56 L66 92 L108 40 L78 40 L90 10 Z"/><text x="126" y="90" fill="currentColor" stroke="none" font-family="Space Grotesk" font-weight="600" font-size="22" text-anchor="middle">7d</text></svg>',
    sprint30: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M70 10 L46 56 L76 56 L66 92 L108 40 L78 40 L90 10 Z"/><text x="126" y="90" fill="currentColor" stroke="none" font-family="Space Grotesk" font-weight="600" font-size="22" text-anchor="middle">30d</text></svg>',
    sprint90: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M70 10 L46 56 L76 56 L66 92 L108 40 L78 40 L90 10 Z"/><text x="126" y="90" fill="currentColor" stroke="none" font-family="Space Grotesk" font-weight="600" font-size="22" text-anchor="middle">90d</text></svg>',
    library: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="22" width="18" height="66" rx="2"/><rect x="46" y="14" width="18" height="74" rx="2" opacity="0.8"/><rect x="70" y="26" width="18" height="62" rx="2"/><rect x="94" y="18" width="18" height="70" rx="2" opacity="0.8"/><path d="M118 30 L134 26 L148 86 L132 90 Z"/></svg>',
    tools: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="30" y1="26" x2="130" y2="26" opacity="0.5"/><line x1="30" y1="52" x2="130" y2="52" opacity="0.5"/><line x1="30" y1="78" x2="130" y2="78" opacity="0.5"/><circle cx="96" cy="26" r="8" fill="currentColor" stroke="none"/><circle cx="56" cy="52" r="8" fill="currentColor" stroke="none"/><circle cx="110" cy="78" r="8" fill="currentColor" stroke="none"/></svg>',
    allaccess: '<svg viewBox="0 0 160 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M80 12 L90 40 L120 40 L96 58 L105 88 L80 70 L55 88 L64 58 L40 40 L70 40 Z"/></svg>',
  };
  const PRODUCTS = {
    launchpad: { num: "01", theme: "light", format: "30-Day Program", title: "Side Income Launchpad" },
    gigs: { num: "02", theme: "dark", format: "Gig Guide", title: "Online Gig Playbook" },
    hustle: { num: "03", theme: "light", format: "Tracking System", title: "The Side Hustle Ledger" },
    academy: { num: "04", theme: "dark", format: "Complete Course", title: "Digital Product Academy" },
    freelance: { num: "05", theme: "light", format: "Starter Kit", title: "The Freelance Starter Kit" },
    flip: { num: "06", theme: "dark", format: "Reselling Guide", title: "The Flip Playbook" },
    tutoring: { num: "07", theme: "light", format: "Teaching Guide", title: "The Online Tutoring Playbook" },
    sprint7: { num: "", theme: "light", format: "Side Hustle Sprint", title: "7-Day Sprint" },
    sprint30: { num: "", theme: "dark", format: "Side Hustle Sprint", title: "30-Day Sprint" },
    sprint90: { num: "", theme: "light", format: "Side Hustle Sprint", title: "90-Day Sprint" },
    library: { num: "01–05", theme: "dark", format: "Complete Bundle", title: "The Full Infoelev Library" },
    tools: { num: "", theme: "light", format: "Monthly Membership", title: "Infoelev Tools" },
    allaccess: { num: "", theme: "dark", format: "Monthly Membership", title: "Infoelev All Access" },
  };
  const key = new URLSearchParams(location.search).get("p") || "launchpad";
  const p = PRODUCTS[key];
  const el = document.getElementById("cover");
  el.className = "cover " + p.theme;
  el.innerHTML =
    '<div class="top"><span class="num">' + p.num + '</span><span class="brand">Info<em>elev</em></span></div>' +
    '<div class="art">' + ART[key] + '</div>' +
    '<div class="format">' + p.format + '</div>' +
    '<h1>' + p.title + '</h1>';
</script>
</body>
</html>
